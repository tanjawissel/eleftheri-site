<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seite nicht gefunden — ELEFTHERI</title>
<meta name="robots" content="noindex" />
<!-- Bewusst ohne externe Dateien: Die Fehlerseite wird unter beliebigen Pfaden
     ausgeliefert, relative Verweise auf styles.css würden dort ins Leere gehen. -->
<style>
  body { margin:0; background:#FAF7F2; color:#3B2C1A; font-family:"Lato","Segoe UI",Arial,sans-serif;
         line-height:1.7; display:grid; place-items:center; min-height:100vh; padding:2rem; }
  .box { max-width:34rem; text-align:center; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-weight:500; font-size:clamp(2rem,1.4rem+2.4vw,3rem); margin:0 0 1rem; }
  p { font-size:1.15rem; }
  .mark { letter-spacing:.32em; font-weight:700; font-size:.9rem; margin-bottom:2rem; }
  a.btn { display:inline-block; margin-top:1.5rem; background:#C2714F; color:#fff; font-size:1.2rem;
          font-weight:700; text-decoration:none; padding:.9rem 1.7rem; border-radius:4px; }
</style>
</head>
<body>
  <div class="box">
    <p class="mark">ELEFTHERI</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Manchmal führt ein Weg ins Leere. Das ist kein Grund, stehen zu bleiben.</p>
    <p><a class="btn" href="/">Zur Startseite</a></p>
  </div>
</body>
</html>
